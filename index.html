<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JTG PART | بازرگانی جان محمدی - لوازم یدکی خودروهای چینی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14171a;
    --bg-panel: #1b1f23;
    --bg-raised: #21262b;
    --steel: #4d6a83;
    --steel-light: #7c96ab;
    --amber: #e0a02f;
    --amber-dim: #b9832a;
    --danger: #c1440e;
    --ink: #eceef0;
    --ink-dim: #9ba3a9;
    --line: #2e3439;
    --grid-line: rgba(124,150,171,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0/100% 44px,
      var(--bg);
    color:var(--ink);
    font-family:'Vazirmatn', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .oswald{font-family:'Oswald','Vazirmatn',sans-serif;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:var(--amber);color:#1b1f23;}

  /* ===== Top ticker ===== */
  .ticker{
    background:var(--amber);
    color:#1b1f23;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:12.5px;
    letter-spacing:.04em;
    padding:6px 0;
    overflow:hidden;
    white-space:nowrap;
    direction:ltr;
  }
  .ticker span{
    display:inline-block;
    padding-inline:2em;
    animation: scroll 28s linear infinite;
  }
  @keyframes scroll{
    from{transform:translateX(0);}
    to{transform:translateX(-50%);}
  }
  @media (prefers-reduced-motion: reduce){
    .ticker span{animation:none;}
  }

  /* ===== Header ===== */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(20,23,26,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    max-width:1180px;margin:0 auto;padding:10px 20px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-logo{
    height:50px;
    width:auto;
    object-fit:contain;
  }
  .brand-name{font-family:'Oswald',sans-serif;font-weight:700;font-size:20px;letter-spacing:.01em;}
  .brand-sub{font-size:11px;color:var(--ink-dim);letter-spacing:.05em;margin-top:1px;}

  nav{display:flex;gap:26px;font-size:14.5px;color:var(--ink-dim);}
  nav a:hover{color:var(--ink);}

  .header-actions{display:flex;align-items:center;gap:14px;}
  .search-box{
    display:flex;align-items:center;background:var(--bg-raised);
    border:1px solid var(--line);
    padding:8px 12px;gap:8px;min-width:200px;
  }
  .search-box input{
    background:transparent;border:none;outline:none;color:var(--ink);
    font-family:inherit;font-size:13.5px;width:100%;
  }
  .search-box input::placeholder{color:var(--ink-dim);}
  .cart-btn{
    display:flex;align-items:center;gap:8px;
    background:var(--amber);color:#1b1f23;border:none;
    padding:9px 14px;font-weight:700;font-size:13.5px;
    font-family:'Oswald',sans-serif;letter-spacing:.03em;
    position:relative;
  }
  .cart-count{
    background:#1b1f23;color:var(--amber);
    border-radius:50%;min-width:19px;height:19px;
    font-size:11px;display:flex;align-items:center;justify-content:center;
    font-family:'Vazirmatn';font-weight:700;
  }

  /* ===== Hero ===== */
  .hero{
    max-width:1180px;margin:0 auto;padding:64px 20px 40px;
    display:grid;grid-template-columns:1.15fr 0.85fr;gap:40px;align-items:end;
  }
  .hero-eyebrow{
    font-family:'Oswald',sans-serif;font-size:13px;font-weight:600;
    color:var(--amber);letter-spacing:.18em;text-transform:uppercase;
    display:flex;align-items:center;gap:10px;margin-bottom:18px;
  }
  .hero-eyebrow::before{content:'';width:26px;height:2px;background:var(--amber);display:inline-block;}
  .hero h1{
    font-family:'Oswald',sans-serif;font-weight:700;
    font-size:clamp(34px,4.6vw,58px);line-height:1.08;margin:0 0 18px;
  }
  .hero h1 em{color:var(--amber);font-style:normal;}
  .hero p{color:var(--ink-dim);font-size:15.5px;line-height:1.9;max-width:520px;margin:0 0 26px;}
  .hero-actions{display:flex;gap:12px;}
  .btn-primary{
    background:var(--amber);color:#1b1f23;border:none;padding:14px 26px;
    font-family:'Oswald',sans-serif;font-weight:700;font-size:14.5px;letter-spacing:.02em;
    transition:transform .15s ease;
  }
  .btn-primary:hover{transform:translateY(-2px);}
  .btn-ghost{
    background:transparent;border:1px solid var(--line);color:var(--ink);
    padding:14px 22px;font-size:14.5px;font-family:'Oswald',sans-serif;font-weight:500;
  }
  .btn-ghost:hover{border-color:var(--steel-light);}

  .hero-panel{
    background:var(--bg-panel);border:1px solid var(--line);
    padding:24px;position:relative;
  }
  .hero-panel::before{
    content:'برگه فنی';
    position:absolute;top:-11px;right:20px;background:var(--bg);
    padding:0 10px;font-size:11.5px;color:var(--ink-dim);
    font-family:'Oswald',sans-serif;letter-spacing:.08em;
  }
  .spec-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px dashed var(--line);font-size:13.5px;}
  .spec-row:last-child{border-bottom:none;}
  .spec-row span:first-child{color:var(--ink-dim);}
  .spec-row span:last-child{font-family:'Oswald',sans-serif;color:var(--ink);font-weight:500;}

  /* ===== Category strip ===== */
  .cat-strip{
    max-width:1180px;margin:10px auto 0;padding:0 20px;
    display:flex;gap:10px;flex-wrap:wrap;
    border-top:1px solid var(--line);padding-top:22px;
  }
  .cat-chip{
    border:1px solid var(--line);background:var(--bg-panel);
    padding:9px 16px;font-size:13.5px;color:var(--ink-dim);
    display:flex;align-items:center;gap:8px;
  }
  .cat-chip.active{border-color:var(--amber);color:var(--amber);background:rgba(224,160,47,0.08);}
  .cat-chip:hover{color:var(--ink);}
  .cat-chip .n{font-family:'Oswald',sans-serif;font-size:11px;color:var(--steel-light);}

  /* ===== Catalog ===== */
  .catalog{max-width:1180px;margin:0 auto;padding:36px 20px 80px;}
  .catalog-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px;}
  .catalog-head h2{font-family:'Oswald',sans-serif;font-size:22px;margin:0;}
  .catalog-head .count{font-size:13px;color:var(--ink-dim);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;}
  .card{
    background:var(--bg-panel);border:1px solid var(--line);
    display:flex;flex-direction:column;overflow:hidden;
    transition:border-color .15s ease, transform .15s ease;
  }
  .card:hover{border-color:var(--steel-light);transform:translateY(-3px);}
  .card-media{
    position:relative;height:150px;
    background:
      repeating-linear-gradient(135deg, rgba(124,150,171,0.07) 0 10px, transparent 10px 20px),
      var(--bg-raised);
    display:flex;align-items:center;justify-content:center;
    border-bottom:1px solid var(--line);
  }
  .card-media .glyph{font-size:44px;opacity:.75;filter:grayscale(1) brightness(1.4);}
  .tag{
    position:absolute;top:10px;left:10px;
    font-family:'Oswald',sans-serif;font-size:10.5px;font-weight:600;
    padding:4px 8px;letter-spacing:.04em;
  }
  .tag.sale{background:var(--danger);color:#fff;}
  .tag.new{background:var(--steel);color:#fff;}
  .part-id{
    position:absolute;bottom:10px;right:10px;
    font-family:'Oswald',sans-serif;font-size:10.5px;color:var(--ink-dim);
    background:rgba(20,23,26,0.75);padding:3px 7px;letter-spacing:.03em;
  }
  .card-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1;}
  .card-compat{font-size:11.5px;color:var(--steel-light);letter-spacing:.02em;}
  .card-title{font-size:15px;font-weight:600;line-height:1.4;}
  .card-foot{margin-top:auto;display:flex;align-items:center
